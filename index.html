const CartContext = createContext(null);
const useCart = () => useContext(CartContext);

function CartProvider({ children }) {
  const [items, setItems] = useState([]);
  const [isDrawerOpen, setDrawerOpen] = useState(false);
  const [orderType, setOrderType] = useState("ridicare");
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = (message) => {
    setToast(message);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  };

  const addItem = (product) => {
    setItems((prev) => {
      const existing = prev.find((i) => i.id === product.id);
      if (existing) return prev.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { id: product.id, title: product.name, price: product.price, qty: 1 }];
    });
    showToast(`${product.name} adăugat în coș`);
  };

  const incQty = (id) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, qty: i.qty + 1 } : i)));
  const decQty = (id) => setItems((prev) => prev.flatMap((i) => (i.id === id ? (i.qty <= 1 ? [] : [{ ...i, qty: i.qty - 1 }]) : [i])));
  const removeItem = (id) => setItems((prev) => prev.filter((i) => i.id !== id));

  const totalCount = useMemo(() => items.reduce((sum, i) => sum + i.qty, 0), [items]);
  const totalPrice = useMemo(() => items.reduce((sum, i) => sum + i.qty * i.price, 0), [items]);

  const value = { items, addItem, incQty, decQty, removeItem, totalCount, totalPrice, isDrawerOpen, openDrawer: () => setDrawerOpen(true), closeDrawer: () => setDrawerOpen(false), orderType, setOrderType, toast };
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}

}

function CartDrawer() {
  const { items, incQty, decQty, removeItem, totalPrice, isDrawerOpen, closeDrawer, orderType, setOrderType } = useCart();

  useEffect(() => {
    if (!isDrawerOpen) return;
    const onKey = (e) => e.key === "Escape" && closeDrawer();
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [isDrawerOpen, closeDrawer]);

  const buildWhatsAppMessage = () => {
    const lines = [
      "Comandă nouă — Mio Artegianale", "",
      ...items.map((i) => `• ${i.qty}× ${i.title} — ${i.qty * i.price} LEI`), "",
      `Total: ${totalPrice} LEI`,
      orderType === "ridicare" ? `Ridicare din: ${ADDRESS}` : "Livrare: Delivery în Cluj-Napoca",
    ];
    return encodeURIComponent(lines.join("\n"));
  };
  const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${buildWhatsAppMessage()}`;

  if (!isDrawerOpen) return null;

  return (
    <div className="fixed inset-0 z-[70] flex justify-end">

function scrollToId(id, closeMenus) {
  if (closeMenus) closeMenus();
  const el = document.getElementById(id);
  if (!el) return;
  const headerOffset = 84;
  const top = el.getBoundingClientRect().top + window.scrollY - headerOffset;
  window.scrollTo({ top, behavior: "smooth" });
}

    const q = query.trim().toLowerCase();
    return ALL_ITEMS.filter((item) => {
      const matchesTab = activeTab === "toate" || item.category === activeTab;
      if (!matchesTab) return false;
      if (!q) return true;
      const haystack = [item.name, ...item.ingredients].join(" ").toLowerCase();
      return haystack.includes(q);
    });

  const visibleItems = useMemo(() => {
    if (isSearching || expanded) return filtered;

const OPEN_HOUR = 11;
const CLOSE_HOUR = 22;

function useOpenStatus() {
  const [status, setStatus] = useState(null);
  useEffect(() => {
    const compute = () => {
      const now = new Date();
      const hour = now.getHours() + now.getMinutes() / 60;
      const isOpen = hour >= OPEN_HOUR && hour < CLOSE_HOUR;
      setStatus({ isOpen, label: isOpen ? "Deschis acum" : "Închis acum", detail: isOpen ? `Închide la ${CLOSE_HOUR}:00` : `Deschide la ${OPEN_HOUR}:00` });
    };
    compute();
    const id = setInterval(compute, 60 * 1000);
    return () => clearInterval(id);
  }, []);
  return status;
}
